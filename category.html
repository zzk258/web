<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版块 · TechNotes</title>
<meta name="description" content="按方向归档的技术日志">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/main.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem("notes-theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="cat-hero" id="cat-hero"></section>

  <section class="wrap" style="padding-top:26px;padding-bottom:56px">
    <div class="card-grid" id="grid"></div>
  </section>
</main>

<div id="site-footer"></div>
<div class="lightbox" id="lightbox"></div>

<style>
  /* 本地删除按钮：只在 127.0.0.1/localhost 下由 JS 注入，线上完全不存在 */
  .pc-wrap { position: relative; }
  .pc-wrap .post-card { height: 100%; }
  .pc-del {
    position: absolute; top: 10px; right: 10px; z-index: 6;
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(15,23,42,.45); color: #fff;
    cursor: pointer; opacity: 0; padding: 0;
    transition: opacity .15s ease, background .15s ease, border-color .15s ease;
    backdrop-filter: blur(4px);
  }
  .pc-wrap:hover .pc-del, .pc-del:focus-visible { opacity: 1; }
  .pc-del:hover { background: #dc2626; border-color: #dc2626; }
  .pc-del:disabled { opacity: .4; cursor: wait; }
  .pc-del .i { width: 15px; height: 15px; }
  /* 触屏设备没有 hover，常显但降低存在感 */
  @media (hover: none) { .pc-del { opacity: .75; } }
</style>

<script src="data/posts.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  var A = window.App;
  var catId = new URLSearchParams(location.search).get("cat") || (A.CATS[0] && A.CATS[0].id);
  var cat = null;
  for (var i = 0; i < A.CATS.length; i++) if (A.CATS[i].id === catId) cat = A.CATS[i];

  var heroEl = document.getElementById("cat-hero");
  var gridEl = document.getElementById("grid");

  if (!cat) {
    heroEl.innerHTML = '<div class="wrap cat-hero-inner"><div><h1>版块不存在</h1>' +
      '<p>这个版块可能已经被重命名或删除。</p>' +
      '<div class="cm"><a href="index.html">返回首页</a></div></div></div>';
    gridEl.innerHTML = A.CATS.map(function (c) {
      return '<a class="cat-card" href="' + A.catUrl(c.id) + '" style="--c:' + c.color + '">' +
        '<span class="cat-icon">' + A.icon(c.icon) + '</span>' +
        '<h3>' + A.esc(c.name) + '</h3><p>' + A.esc(c.desc || "") + '</p></a>';
    }).join("");
    document.title = "版块不存在 · " + (A.SITE.title || "TechNotes");
    return;
  }

  var posts = A.postsOf(cat.id);
  document.title = cat.name + " · " + (A.SITE.title || "TechNotes");
  heroEl.style.setProperty("--c", cat.color);

  var last = posts.length ? A.fmtDate(posts[0].date) : "暂无";
  heroEl.innerHTML =
    '<div class="wrap cat-hero-inner">' +
    '<span class="cat-icon">' + A.icon(cat.icon) + '</span>' +
    '<div>' +
    '<h1>' + A.esc(cat.name) + '</h1>' +
    '<p>' + A.esc(cat.desc || "") + '</p>' +
    '<div class="cm"><span>' + posts.length + ' 篇日志</span><span>最近更新 ' + last + '</span>' +
    '<a href="index.html#archive" style="color:inherit;text-decoration:none">在全部日志中查看 →</a></div>' +
    '</div></div>';

  gridEl.innerHTML = posts.length
    ? posts.map(function (p) {
        var card = A.postCard(p);
        // 仅本地服务访问时，给每张卡片挂一个删除按钮（线上渲染出的就是纯卡片，与原来完全一致）
        if (!A.isLocal) return card;
        return '<div class="pc-wrap">' + card +
          '<button type="button" class="pc-del" data-del-id="' + A.esc(p.id) +
          '" data-del-title="' + A.esc(p.title) +
          '" title="删除这篇日志" aria-label="删除：' + A.esc(p.title) + '">' +
          A.icon("trash") + '</button></div>';
      }).join("")
    : '<div class="empty" style="grid-column:1/-1">这个版块还没有日志，去 <a href="' +
      (A.editorHref || "index.html#archive") + '">' + (A.editorHref ? "写一篇" : "全部日志里看看") + "</a> 吧。</div>";

  // ---- 本地删除流程：确认 -> 输入删除密码 -> POST /delete -> 刷新 ----
  if (A.isLocal && posts.length) {
    gridEl.addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest(".pc-del") : null;
      if (!btn) return;
      e.preventDefault();

      var id = btn.getAttribute("data-del-id");
      var title = btn.getAttribute("data-del-title");
      if (!confirm(
        "确定删除这篇日志吗？\n\n" +
        "《" + title + "》\n\n" +
        "将从 data/posts.js 移除并 git push，线上约 1 分钟后消失。\n" +
        "此操作不可恢复（只能靠 git 历史找回）。"
      )) return;

      var pwd = prompt("请输入删除密码：");
      if (pwd === null) return;   // 用户取消

      btn.disabled = true;
      fetch("/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, password: pwd })
      }).then(function (r) {
        return r.json().catch(function () {
          throw new Error("本地服务没有响应 /delete 接口。\n" +
            "请确认站点是用 python serve.py 启动的；如果服务是老版本，重启一次（Ctrl+C 后重新 python serve.py）。");
        });
      }).then(function (res) {
        alert(res.message || (res.ok ? "删除成功" : "删除失败"));
        if (res.ok) location.reload();
        else btn.disabled = false;
      }).catch(function (err) {
        alert(err && err.message ? err.message : "删除失败：网络或本地服务异常");
        btn.disabled = false;
      });
    });
  }
})();
</script>
</body>
</html>
