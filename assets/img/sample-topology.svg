<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="VLAN 三层交换组网示意">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#101d2b"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#17293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="400" fill="url(#bg)"/>
  <rect width="900" height="400" fill="url(#grid)"/>

  <!-- links -->
  <g stroke="#2b4a68" stroke-width="2" fill="none">
    <path d="M450 128 V178"/>
    <path d="M270 178 H630"/>
    <path d="M270 178 V228"/>
    <path d="M630 178 V228"/>
    <path d="M270 298 V330"/>
    <path d="M630 298 V330"/>
  </g>
  <g stroke="#3f7fb8" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity=".8">
    <path d="M450 178 V228" />
  </g>

  <!-- core -->
  <rect x="340" y="58" width="220" height="70" rx="14" fill="#132335" stroke="#3f7fb8" stroke-width="1.6"/>
  <text x="450" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="19" font-weight="600" fill="#dce9f7">核心三层交换机</text>
  <text x="450" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#7ea3c4">SVI 192.168.10.1 / 20.1</text>

  <!-- access a -->
  <rect x="180" y="228" width="180" height="70" rx="14" fill="#132335" stroke="#2f6b52" stroke-width="1.6"/>
  <text x="270" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="17" font-weight="600" fill="#d7ecdf">接入交换机 A</text>
  <text x="270" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#6fae90">VLAN 10</text>

  <!-- access b -->
  <rect x="540" y="228" width="180" height="70" rx="14" fill="#132335" stroke="#2f6b52" stroke-width="1.6"/>
  <text x="630" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="17" font-weight="600" fill="#d7ecdf">接入交换机 B</text>
  <text x="630" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#6fae90">VLAN 20</text>

  <!-- terminals -->
  <g font-family="ui-monospace, monospace" font-size="12" fill="#8fa9c0">
    <rect x="212" y="330" width="116" height="34" rx="8" fill="#0f1b27" stroke="#24384c"/>
    <text x="270" y="352" text-anchor="middle">PC 192.168.10.24</text>
    <rect x="572" y="330" width="116" height="34" rx="8" fill="#0f1b27" stroke="#24384c"/>
    <text x="630" y="352" text-anchor="middle">PC 192.168.20.31</text>
  </g>

  <!-- trunk labels -->
  <text x="296" y="212" font-family="ui-monospace, monospace" font-size="11" fill="#4d9fff">trunk</text>
  <text x="600" y="212" font-family="ui-monospace, monospace" font-size="11" fill="#4d9fff">trunk</text>
  <text x="458" y="212" font-family="ui-monospace, monospace" font-size="11" fill="#4d9fff">本地路由转发</text>
</svg>
